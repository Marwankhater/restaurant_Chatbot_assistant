recipe: default.v1
language: ar
assistant_id: restaurant-reservations

pipeline:
- name: WhitespaceTokenizer
- name: RegexFeaturizer
- name: LexicalSyntacticFeaturizer
- name: CountVectorsFeaturizer
# Character n-grams make the model robust to Arabic spelling variants and Egyptian forms.
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 1
  max_ngram: 4
- name: DIETClassifier
  epochs: 100
  constrain_similarities: true
  random_seed: 42
- name: EntitySynonymMapper
- name: FallbackClassifier
  threshold: 0.5
  ambiguity_threshold: 0.1

policies:
- name: MemoizationPolicy
- name: RulePolicy
  core_fallback_threshold: 0.3
  core_fallback_action_name: action_default_fallback
- name: TEDPolicy
  max_history: 5
  epochs: 100
  constrain_similarities: true
  random_seed: 42
