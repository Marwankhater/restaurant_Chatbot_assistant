version: "3.1"

rules:
- rule: greet
  steps:
  - intent: greet
  - action: utter_greet

- rule: goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: thanks
  steps:
  - intent: thank
  - action: utter_you_are_welcome

- rule: say it is a bot
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: opening hours
  condition:
  - active_loop: null
  steps:
  - intent: ask_opening_hours
  - action: action_opening_hours

- rule: not understood
  steps:
  - intent: nlu_fallback
  - action: utter_default

# Booking -------------------------------------------------------------------

- rule: start a booking
  condition:
  - active_loop: null
  steps:
  - intent: book_table
  - action: reservation_form
  - active_loop: reservation_form

- rule: all details collected, check the table
  condition:
  - active_loop: reservation_form
  steps:
  - action: reservation_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_check_availability

- rule: guest confirms
  condition:
  - slot_was_set:
    - awaiting_confirmation: true
  steps:
  - intent: affirm
  - action: action_create_reservation

- rule: guest declines
  condition:
  - slot_was_set:
    - awaiting_confirmation: true
  steps:
  - intent: deny
  - action: action_discard_draft

- rule: opening hours asked in the middle of a booking
  condition:
  - active_loop: reservation_form
  steps:
  - intent: ask_opening_hours
  - action: action_opening_hours
  - action: reservation_form
  - active_loop: reservation_form

- rule: guest stops in the middle of a booking
  condition:
  - active_loop: reservation_form
  steps:
  - intent: deny
  - action: action_deactivate_loop
  - active_loop: null
  - action: action_discard_draft

# Looking up and cancelling -------------------------------------------------

- rule: start a cancellation
  condition:
  - active_loop: null
  steps:
  - intent: cancel_reservation
  - action: lookup_form
  - active_loop: lookup_form

- rule: start a lookup
  condition:
  - active_loop: null
  steps:
  - intent: check_reservation
  - action: lookup_form
  - active_loop: lookup_form

- rule: code and phone collected
  condition:
  - active_loop: lookup_form
  steps:
  - action: lookup_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_lookup_reservation
