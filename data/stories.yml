version: "3.1"

stories:
- story: booking from greeting to confirmation
  steps:
  - intent: greet
  - action: utter_greet
  - intent: book_table
  - action: reservation_form
  - active_loop: reservation_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_check_availability
  - slot_was_set:
    - awaiting_confirmation: true
  - intent: affirm
  - action: action_create_reservation
  - intent: thank
  - action: utter_you_are_welcome

- story: guest changes their mind at the confirmation
  steps:
  - intent: book_table
  - action: reservation_form
  - active_loop: reservation_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_check_availability
  - slot_was_set:
    - awaiting_confirmation: true
  - intent: deny
  - action: action_discard_draft

- story: cancel a reservation
  steps:
  - intent: cancel_reservation
  - action: lookup_form
  - active_loop: lookup_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_lookup_reservation
  - intent: goodbye
  - action: utter_goodbye
